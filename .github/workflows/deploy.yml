name: Deploy Cargo Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install and configure Nginx on EC2
      - name: Setup Nginx on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Updating packages..."
            sudo apt-get update -y

            echo "Installing Nginx..."
            sudo apt-get install -y nginx

            echo "Creating website directory..."
            sudo mkdir -p /var/www/cargo

            echo "Setting permissions..."
            sudo chown -R $USER:$USER /var/www/cargo

            echo "Creating Nginx configuration..."

            sudo tee /etc/nginx/sites-available/cargo > /dev/null <<'EOF'
            server {
                listen 80;
                listen [::]:80;

                server_name _;

                root /var/www/cargo;
                index index.html index.htm;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location ~ /\. {
                    deny all;
                }
            }
            EOF

            echo "Enabling Cargo website..."
            sudo ln -sf /etc/nginx/sites-available/cargo /etc/nginx/sites-enabled/cargo

            echo "Removing default Nginx site..."
            sudo rm -f /etc/nginx/sites-enabled/default

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Enabling Nginx..."
            sudo systemctl enable nginx

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Nginx status:"
            sudo systemctl status nginx --no-pager

      # 3. Copy website files to EC2
      - name: Copy website to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "*"
          target: "/tmp/cargo-deploy"

      # 4. Deploy website to Nginx
      - name: Deploy to Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Cleaning old website..."
            sudo rm -rf /var/www/cargo/*

            echo "Copying new website..."
            sudo cp -r /tmp/cargo-deploy/* /var/www/cargo/

            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/cargo
            sudo chmod -R 755 /var/www/cargo

            echo "Testing Nginx..."
            sudo nginx -t

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Checking Nginx status..."
            sudo systemctl status nginx --no-pager

            echo "Deployment completed successfully!"
